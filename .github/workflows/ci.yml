name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The actions below are all v5, which is the first version of each that runs on
# Node 24. v4 runs on Node 20, and GitHub has required Node 24 of an action
# since 2 June 2026 -- so v4 was already being forced onto Node 24 by the
# runner, which said so in every log: "Node.js 20 is deprecated. The following
# actions target Node.js 20 but are being forced to run on Node.js 24". Being
# carried by a compatibility shim is not the same as being supported, and the
# shim is the part that goes away.
#
# v5 needs runner v2.327.1 or newer, which the hosted runners are well past.

jobs:
  # Neither of these depends on the Node that runs it. Biome is its own binary,
  # and tsc's diagnostics come from the TypeScript version in package.json
  # rather than from the runtime -- so running them once per matrix leg was
  # asking the same question twice and getting the same answer.
  #
  # In a job of their own rather than on one leg of the matrix, because the
  # cheapest failure should also be the fastest to hear about and it was not:
  # lint sat behind `npm ci`, a pip install and an apt install, none of which it
  # needs. This job installs nothing but the packages.
  #
  # Not a dependency of the jobs below. A lint error and a failing test are both
  # worth knowing about on the same run, and making the matrix wait for this
  # would add its length to every push that was fine.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The current one. Which it is does not matter here, and that is the
          # point of the job.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Before the type check, because a lint failure is the cheapest one to
      # read and there is no sense making somebody wait for tsc to hear it.
      - run: npm run lint

      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the lowest version the project supports, 24 is the current
        # long-term release. Both are what `engines` in package.json claims.
        #
        # It was 20 and 22, and 20 went out of support on 30 April 2026. A
        # matrix leg on a version nobody gets security fixes for is worse than
        # no leg at all: it is a green tick saying the project works somewhere
        # nobody should be running it, and it holds the whole project down to
        # what that version could do.
        #
        # Node 26 becomes the long-term release on 28 October 2026. When it
        # does, this becomes 22 and 26, and then 24 and 26 once 22 goes out of
        # support on 30 April 2027.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The export tests check their output against fontTools, the reference
      # implementation, rather than against this project's own reader -- and
      # against HarfBuzz, which is what actually lays out text with a font.
      # HarfBuzz was missing here, so every test that shapes a word skipped in
      # CI and said nothing: the joins and the ligatures were only ever checked
      # on a machine that happened to have it.
      - name: Install fontTools and HarfBuzz
        run: pip install --quiet fonttools brotli uharfbuzz

      # Tests read a font from the system and skip when none is present, so
      # install one rather than let that coverage silently disappear.
      - name: Install a test font
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: npm test

      # Which type checks as it goes -- `build` is `tsc -b --noEmit && vite
      # build` -- so the types are still checked against every version the
      # project supports. What `check` above adds is hearing about it sooner.
      - run: npm run build

  # Both engines, as two legs of one matrix rather than two jobs one after the
  # other: they run at the same time, so hearing about WebKit costs no more
  # wall-clock than not hearing about it did.
  #
  # WebKit is here because this application is a canvas, an IndexedDB and a
  # pile of font loading, and those three are where WebKit differs from
  # Chromium rather than where it agrees. Testing Chromium alone was testing
  # the half that was never going to be the problem.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install a test font
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: npx playwright install --with-deps ${{ matrix.engine }}

      - run: npm run test:browser -- --project=${{ matrix.engine }}
